name: validate-portfolio-demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: catalogo-operacional-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run isolated API contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate public product identity
        run: python scripts/validate_public_identity.py
      - name: Check canonical frontend syntax
        run: |
          node --check app/renderer/app.js
          node --check app/renderer/adapter.js
          node --check app/renderer/enhancements.js
